<body>
<main>
  <h1>星詠コウジのアプリ</h1>
  <p class="sub">東洋占術（紫微斗数・奇門遁甲）をもとにしたアプリを開発・提供しています。</p>

  <div class="app">

    <a href="https://play.google.com/store/apps/details?id=com.hoshiyomikoji.shibijobhunt">Google Play</a>

    <a href="https://play.google.com/store/apps/details?id=com.hoshiyomikoji.shibilovers">Google Play</a>

  <div class="app">

    <a href="https://play.google.com/store/apps/details?id=com.hoshiyomikoji.kimontonko">Google Play</a>

  <footer>
    開発・運営：星詠コウジ（ほしよみコウジ）<br>
